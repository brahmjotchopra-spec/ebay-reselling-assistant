name: Replace live microfibre listing with four new photos
on:
  push:
    branches: [main]
    paths:
      - 'replace_microfibre_images.py'
      - '.github/workflows/replace-microfibre-images.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ebay-uk-amazon-stage
  cancel-in-progress: false
jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check four existing uploaded photos in repository
        run: |
          for file in assets/microfibre_main_new_ebay.jpg assets/microfibre_details_new_ebay.jpg assets/microfibre_cleaning_new_ebay.jpg assets/microfibre_glass_new_ebay.jpg; do
            test -s "$file" || { echo "Missing uploaded image $file"; exit 1; }
          done
      - name: Update existing live eBay listing photos and verify price and stock
        env:
          EBAY_ACCESS_TOKEN: ${{ secrets.EBAY_ACCESS_TOKEN }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
        run: python3 replace_microfibre_images.py
