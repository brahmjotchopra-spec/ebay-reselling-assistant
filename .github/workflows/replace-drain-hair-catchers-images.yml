name: Replace live drain catcher images with approved two-photo gallery
on:
  push:
    branches: [main]
    paths:
      - 'assets/drain_main.jpg'
      - 'assets/drain_sizes.jpg'
      - 'replace_drain_hair_catchers_images.py'
      - '.github/workflows/replace-drain-hair-catchers-images.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ebay-uk-amazon-stage
  cancel-in-progress: false
jobs:
  revise-live-ebay-offer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Confirm both approved product images are present
        run: |
          python3 - <<'PY'
          from pathlib import Path
          checks = [
            ("assets/drain_main.jpg", 100000, "0d2bd80ac35b07d2d27157f717a1bc6bb4a3efa2"),
            ("assets/drain_sizes.jpg", 100000, "1ac635127ad098b37711149c821d24a2e82deb2b"),
          ]
          import hashlib
          for name,min_size,_ in checks:
              content=Path(name).read_bytes()
              if len(content)<min_size or content[:3]!=bytes.fromhex("ffd8ff"):
                  raise SystemExit("Missing or invalid approved product photo: "+name)
              print("Verified",name,len(content),"bytes",hashlib.sha256(content).hexdigest())
          PY
      - name: Update existing £7.99 eBay listing using approved two-photo gallery
        env:
          EBAY_ACCESS_TOKEN: ${{ secrets.EBAY_ACCESS_TOKEN }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
        run: python3 replace_drain_hair_catchers_images.py
