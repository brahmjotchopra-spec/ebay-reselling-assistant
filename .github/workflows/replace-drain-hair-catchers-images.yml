name: Replace live drain catcher images with approved two-photo gallery
on:
  push:
    branches: [main]
    paths:
      - 'assets/drain_gallery_upload_to_github.zip'
      - '.github/workflows/replace-drain-hair-catchers-images.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ebay-uk-amazon-stage
  cancel-in-progress: false
jobs:
  revise-live-ebay-offer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Validate uploaded approved photographs and extract into image hosting directory
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          z=Path("assets/drain_gallery_upload_to_github.zip")
          if not z.is_file():
              raise SystemExit("User's two-photo ZIP has not been uploaded yet")
          with zipfile.ZipFile(z) as archive:
              wanted={"drain_main.jpg","drain_sizes.jpg"}
              if set(archive.namelist())!=wanted:
                  raise SystemExit("ZIP must contain exactly two named JPGs")
              for name in sorted(wanted):
                  b=archive.read(name)
                  if b[:3]!=bytes.fromhex("ffd8ff") or len(b)<30000:
                      raise SystemExit("Image is invalid or too small: "+name)
                  Path("assets",name).write_bytes(b)
                  print(name, len(b), "bytes")
          PY
      - name: Host approved images in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/drain_main.jpg assets/drain_sizes.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Host two approved drain-sticker product images"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Replace existing live eBay image gallery and verify
        env:
          EBAY_ACCESS_TOKEN: ${{ secrets.EBAY_ACCESS_TOKEN }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
        run: python3 replace_drain_hair_catchers_images.py
