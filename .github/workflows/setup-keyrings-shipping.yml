name: Set up keyring postage without publishing
on:
  push:
    branches: [main]
    paths:
      - 'setup_keyrings_shipping.py'
      - '.github/workflows/setup-keyrings-shipping.yml'

permissions:
  contents: read

concurrency:
  group: ebay-uk-amazon-stage
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Attach free second-class policy and home dispatch to NONLIVE offer
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
          EBAY_ACCESS_TOKEN: ${{ secrets.EBAY_ACCESS_TOKEN }}
        run: python3 setup_keyrings_shipping.py
