name: Publish three owned everyday essentials on eBay UK
on:
  push:
    branches: [main]
    paths:
      - 'publish_household_essentials.py'
      - 'render_household_images.py'
      - '.github/workflows/publish-household-essentials.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ebay-uk-amazon-stage
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Pillow
        run: python3 -m pip install Pillow --quiet
      - name: Create text-free original product illustrations
        run: python3 render_household_images.py
      - name: Upload original illustrations to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/household-microfibre-20.jpg assets/household-air-fryer-liners-100.jpg assets/household-drain-hair-catchers-100.jpg
          if ! git diff --staged --quiet; then
            git commit -m "Add original household essential illustrations for eBay"
            git push origin HEAD:main
          fi
      - name: Publish and verify exactly one prepared lot of each owned household product
        env:
          EBAY_ACCESS_TOKEN: ${{ secrets.EBAY_ACCESS_TOKEN }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
        run: python3 publish_household_essentials.py
