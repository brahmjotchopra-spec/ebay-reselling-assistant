name: Publish owned ACE2ACE white roller on existing eBay UK offer
on:
  push:
    branches: [main]
    paths:
      - 'publish_ace2ace_white_roller.py'
      - '.github/workflows/publish-ace2ace-white-roller.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ebay-uk-amazon-stage
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Publish 1 confirmed-stock ACE2ACE white roller and verify listing and photos
        env:
          EBAY_ACCESS_TOKEN: ${{ secrets.EBAY_ACCESS_TOKEN }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
        run: python3 publish_ace2ace_white_roller.py
