name: Install cable strap eBay gallery from one uploaded ZIP
on:
  push:
    branches: [main]
    paths:
      - 'assets/cable-straps-photos.zip'
      - '.github/workflows/install-cable-straps-gallery.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: install-cable-straps-gallery
  cancel-in-progress: false
jobs:
  install-gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify exactly six received image files and install
        run: |
          python3 -m pip install pillow --quiet
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,io
          from PIL import Image
          source=Path("assets/cable-straps-photos.zip")
          if not source.is_file():
              print("No ZIP yet. Download the gallery from this chat and upload to assets/cable-straps-photos.zip")
              raise SystemExit(0)
          names=[
              "01-main-product.jpg",
              "02-features.jpg",
              "03-detail-fanned.jpg",
              "04-pack-details.jpg",
              "05-in-use-desk.jpg",
              "06-in-use-closeup.jpg",
          ]
          target=Path("assets/cable-straps")
          target.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(source) as z:
              if set(z.namelist())!=set(names):
                  raise ValueError("The ZIP must contain only the six requested JPGs")
              for name in names:
                  image=z.read(name)
                  if len(image)>5_000_000 or not image.startswith(bytes.fromhex("ffd8ff")):
                      raise ValueError("Image invalid or too big: "+name)
                  with Image.open(io.BytesIO(image)) as im:
                      im.verify()
                      if im.width<500 or im.height<500:
                          raise ValueError("Product photo dimensions too small: "+name)
                  (target/name).write_bytes(image)
                  print("STAGED",name,len(image))
          PY
      - name: Publish verified gallery files to GitHub for eBay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d assets/cable-straps ]; then git add assets/cable-straps; fi
          if ! git diff --staged --quiet; then
            git commit -m "Install six buyer-visible cable strap gallery images"
            git push origin HEAD:main
          fi
          echo "Uploaded images are hosted; eBay staging workflow will attach them with zero buyer-visible inventory."
