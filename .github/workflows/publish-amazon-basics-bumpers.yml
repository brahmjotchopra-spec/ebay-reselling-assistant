name: Publish one owned Amazon Basics 300-piece bumper pad set
on:
  push:
    branches: [main]
    paths:
      - 'publish_amazon_basics_bumpers.py'
      - 'render_amazon_basics_bumper_images.py'
      - '.github/workflows/publish-amazon-basics-bumpers.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ebay-uk-amazon-stage
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install image renderer
        run: python3 -m pip install pillow --quiet
      - name: Render original, clearly disclosed product illustrations
        run: python3 render_amazon_basics_bumper_images.py
      - name: Host the original illustrations on GitHub for eBay images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/amazon-basics-bumpers-300-main.jpg assets/amazon-basics-bumpers-300-details.jpg
          if ! git diff --staged --quiet; then
            git commit -m "Add original 300-piece bumper pad listing gallery"
            git push origin HEAD:main
          fi
      - name: Publish one confirmed pack and verify eBay listing
        env:
          EBAY_ACCESS_TOKEN: ${{ secrets.EBAY_ACCESS_TOKEN }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
        run: python3 publish_amazon_basics_bumpers.py
