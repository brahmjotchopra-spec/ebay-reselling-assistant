name: Replace live air-fryer 100-pack main image on eBay UK
on:
  push:
    branches: [main]
    paths:
      - 'replace_air_fryer_main_image.py'
      - 'assets/approved-air-fryer-100-main.jpg.b64'
      - '.github/workflows/replace-air-fryer-main-image.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ebay-uk-amazon-stage
  cancel-in-progress: false
jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Decode and verify exact user-approved main image
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib
          folder=Path("assets")
          raw=base64.b64decode((folder/"approved-air-fryer-100-main.jpg.b64").read_text())
          if not raw.startswith(bytes.fromhex("ffd8ff")) or len(raw)<20000:
              raise ValueError("Approved image invalid or incomplete")
          digest=hashlib.sha256(raw).hexdigest()
          if digest!="fcbef9f60fc15e88bd9be7acfddf0cf196255f22a63ee7bee7af3bfa803fca2c":
              raise ValueError("Image failed SHA-256 approval verification")
          (folder/"approved-air-fryer-100-main.jpg").write_bytes(raw)
          print("Image checked",len(raw),"bytes",digest)
          PY
      - name: Host corrected main picture in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/approved-air-fryer-100-main.jpg
          if ! git diff --staged --quiet; then
            git commit -m "Host approved 100-pack air fryer liner eBay main image"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Update and verify existing live eBay listing main photo
        env:
          EBAY_ACCESS_TOKEN: ${{ secrets.EBAY_ACCESS_TOKEN }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
        run: python3 replace_air_fryer_main_image.py
