name: Replace keyrings listing image
on:
  push:
    branches: [main]
    paths:
      - 'replace_keyrings_image.py'
      - 'assets/keyrings-50-realistic.jpg'
      - '.github/workflows/replace-keyrings-image.yml'

permissions:
  contents: read

concurrency:
  group: ebay-uk-amazon-stage
  cancel-in-progress: false

jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Change image on existing eBay listing, preserve quantity and price
        env:
          EBAY_ACCESS_TOKEN: ${{ secrets.EBAY_ACCESS_TOKEN }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
        run: python3 replace_keyrings_image.py
