name: Prepare eBay keyrings copy (nonlive)

on:
  push:
    branches: [main]
    paths:
      - 'prepare_amazon_offer.py'
      - '.github/workflows/prepare-amazon-offer.yml'

permissions:
  contents: read

concurrency:
  group: ebay-uk-amazon-stage
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare existing unpublished offer
        env:
          EBAY_ACCESS_TOKEN: ${{ secrets.EBAY_ACCESS_TOKEN }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
        run: python3 prepare_amazon_offer.py
