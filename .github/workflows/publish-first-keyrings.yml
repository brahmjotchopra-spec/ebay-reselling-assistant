name: Publish first 50-keyring pack on eBay UK
on:
  push:
    branches: [main]
    paths:
      - 'publish_first_keyrings.py'
      - 'render_keyrings.py'
      - '.github/workflows/publish-first-keyrings.yml'

permissions:
  contents: write

concurrency:
  group: ebay-uk-amazon-stage
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install photo renderer
        run: python3 -m pip install Pillow --quiet
      - name: Create original, text-free illustration
        run: python3 render_keyrings.py
      - name: Commit public image for eBay to retrieve
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/keyrings-50.jpg
          if ! git diff --staged --quiet; then
            git commit -m "Add original keyring product image"
            git push origin HEAD:main
          fi
      - name: Publish existing offer for just one 50-pack
        env:
          EBAY_ACCESS_TOKEN: ${{ secrets.EBAY_ACCESS_TOKEN }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
        run: python3 publish_first_keyrings.py
