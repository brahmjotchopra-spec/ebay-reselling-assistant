name: Read-only eBay UK category lookup
on:
  push:
    branches: [main]
    paths:
      - 'research/category_lookup.py'
      - '.github/workflows/category-lookup.yml'
permissions:
  contents: read
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Read eBay category suggestions
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
          EBAY_ACCESS_TOKEN: ${{ secrets.EBAY_ACCESS_TOKEN }}
        run: PYTHONPATH=. python3 research/category_lookup.py
