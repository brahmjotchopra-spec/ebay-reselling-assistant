name: Diagnose and retry third drain catcher eBay listing
on:
  push:
    branches: [main]
    paths:
      - 'retry_drain_catcher_publish.py'
      - '.github/workflows/retry-drain-catcher-publish.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ebay-uk-amazon-stage
  cancel-in-progress: false
jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Publish existing drain catcher offer if valid and output safe eBay validation details
        env:
          EBAY_ACCESS_TOKEN: ${{ secrets.EBAY_ACCESS_TOKEN }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
        run: python3 retry_drain_catcher_publish.py
