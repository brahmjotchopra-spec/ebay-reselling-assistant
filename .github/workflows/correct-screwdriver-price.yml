name: Correct live screwdriver listing price for actual £7.99 cost
on:
  push:
    branches: [main]
    paths:
      - 'correct_screwdriver_price.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ebay-uk-amazon-stage
  cancel-in-progress: false
jobs:
  revise:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Fix live price and independently confirm same listing ID
        env:
          EBAY_ACCESS_TOKEN: ${{ secrets.EBAY_ACCESS_TOKEN }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
        run: python3 correct_screwdriver_price.py
