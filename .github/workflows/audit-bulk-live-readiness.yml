name: Audit three stocked eBay bulk offers (read-only)
on:
  push:
    branches: [main]
    paths:
      - 'audit_bulk_live_readiness.py'
      - '.github/workflows/audit-bulk-live-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ebay-uk-audit-bulk
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check eBay offers, image requirements, policies and locations without publishing
        env:
          EBAY_ACCESS_TOKEN: ${{ secrets.EBAY_ACCESS_TOKEN }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
        run: python3 audit_bulk_live_readiness.py
