name: Create photos and publish owned 10 number plate adhesive pads
on:
  push:
    branches: [main]
    paths:
      - 'publish_number_plate_pads10.py'
      - 'render_number_plate_pads_gallery.py'
      - '.github/workflows/publish-number-plate-pads10.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ebay-uk-amazon-stage
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Install photo generation dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet pillow
      - name: Render six original listing images showing ten, not fifty pads
        run: python3 render_number_plate_pads_gallery.py
      - name: Publish original exact gallery on GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/number-plate-pads/
          if ! git diff --staged --quiet; then
            git commit -m "Add six original 10-pad product gallery illustrations"
            git push origin HEAD:main
          fi
      - name: Publish exact one-owner-confirmed 10-pad eBay lot and verify listing
        env:
          EBAY_ACCESS_TOKEN: ${{ secrets.EBAY_ACCESS_TOKEN }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
        run: |
          sleep 12
          python3 publish_number_plate_pads10.py
